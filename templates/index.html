<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Motion Simulation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .controls { margin: 20px; }
        .charts { display: flex; flex-wrap: wrap; justify-content: center; }
        .chart-container { margin: 15px; }
        canvas { border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Projectile Motion Simulation</h1>
    <div class="controls">
        <label for="velocity">Initial Velocity (m/s):</label>
        <input type="range" id="velocity" min="1" max="100" value="25">
        <span id="velocity-value">25</span>
        <label for="angle">Launch Angle (degrees):</label>
        <input type="range" id="angle" min="0" max="90" value="45">
        <span id="angle-value">45</span>
    </div>
    <div class="charts">
        <div class="chart-container">
            <h2>Projectile Trajectory</h2>
            <canvas id="trajectoryChart" width="400" height="400"></canvas>
        </div>
        <div class="chart-container">
            <h2>Kinematic Graphs</h2>
            <canvas id="kinematicsChart" width="800" height="400"></canvas>
        </div>
    </div>
    <script src="/static/main.js"></script>
</body>
</html>
